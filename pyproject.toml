[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-service"
version = "0.1.0"
description = "Long-term memory for agents: episodic and semantic memories with TTLs, PII scrubbing, supersession and hybrid recall on PostgreSQL and pgvector."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
embed = ["torch>=2.4", "transformers>=4.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "httpx>=0.28"]

[project.scripts]
memsvc = "memsvc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memsvc = ["schema.sql"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
max-line-length = 180

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["model: needs the MiniLM embedding model (downloads about 90 MB once)"]

[tool.coverage.run]
source = ["memsvc"]
