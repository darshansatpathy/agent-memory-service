[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-service"
version = "0.1.0"
description = "Long-term memory for agents: episodic and semantic memories with TTLs, PII scrubbing, supersession and hybrid recall on PostgreSQL and pgvector."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "psycopg[binary,pool]>=3.3.8",
  "pgvector>=0.5.1",
  "numpy>=2.4.6",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
embed = ["torch>=2.15.0", "transformers>=5.22.1"]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1.post1", "pytest-cov>=7.1.0", "ruff>=0.17.3", "mypy>=2.4.1", "httpx>=0.28.1"]

[project.scripts]
memsvc = "memsvc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memsvc = ["schema.sql"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
max-line-length = 180

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["model: needs the MiniLM embedding model (downloads about 90 MB once)"]

[tool.coverage.run]
source = ["memsvc"]
